role_model:
  role:
    definition: Профессиональная функция внутри проекта.
  role_module:
    definition: Полная учебно-инженерная реализация роли в P00-P20.
    required_elements:
      - competencies
      - theory
      - practice
      - tools
      - inputs
      - actions
      - artifacts
      - tests
      - evidence
      - handoff
  career_profile:
    definition: Перевод доказанных результатов роли в язык вакансий, резюме, портфолио и собеседований.
  responsibilities:
    note: Evidence owner, reviewer, approver, recovery owner и handoff owner являются типами ответственности, а не отдельными карьерными ролями.

