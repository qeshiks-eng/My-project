$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.invalid/ecp/v12/tool-registry.schema.yaml
title: ECP Tool Registry
type: object
additionalProperties: false
required: [api_version, kind, metadata, tools]
properties:
  api_version:
    const: ecp/v12
  kind:
    const: ToolRegistry
  metadata:
    type: object
    required: [status, generated_from]
    properties:
      status:
        enum: [MIGRATION_CANDIDATE, ACTIVE, SUPERSEDED]
      generated_from:
        type: string
      source_sha256:
        type: string
        pattern: '^[a-fA-F0-9]{64}$'
      normalized_at:
        type: string
        format: date-time
  tools:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - tool_id
        - canonical_name
        - category
        - type
        - depth
        - status
      properties:
        tool_id:
          type: string
          pattern: '^TOOL-[A-Z0-9-]{3,64}$'
        canonical_name:
          type: string
        aliases:
          type: array
          uniqueItems: true
          items:
            type: string
        category:
          type: string
        type:
          enum: [product, platform, component, library, specification, internal-product, internal-library]
        parent_tool_id:
          type: string
        components:
          type: array
          uniqueItems: true
          items:
            type: string
        license:
          type: string
        cost_model:
          enum: [free, open-source, commercial, mixed, unknown]
        availability:
          type: string
        version_policy:
          type: string
        official_manual:
          type: string
        projects:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^P(0[0-9]|1[0-9]|20)$'
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^R(0[1-9]|1[0-9]|2[0-6])$'
        orchestrators:
          type: array
          uniqueItems: true
          items:
            enum: [controller, core, delivery, defense, attack, investigation, recovery, assurance]
        depth:
          enum: [CORE, WORKING, INTEGRATED, REFERENCE]
        status:
          enum: [CATALOGUED, ASSIGNED, INSTALLED, USED, VALIDATED]
        evidence_refs:
          type: array
          items:
            type: string
        notes:
          type: string
