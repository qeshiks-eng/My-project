$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.invalid/ecp/v12/run-context.schema.yaml
title: ECP Run Context
type: object
additionalProperties: false
required:
  - api_version
  - run_id
  - project_id
  - scenario_id
  - phase
  - state
  - started_at_utc
  - scope
  - versions
properties:
  api_version:
    const: ecp/v12
  run_id:
    type: string
    pattern: '^[a-z0-9][a-z0-9._-]{5,127}$'
  project_id:
    type: string
    pattern: '^P(0[0-9]|1[0-9]|20)$'
  scenario_id:
    type: string
  phase:
    enum: [baseline, run-a, remediation, run-b, recovery, assurance]
  environment:
    type: string
  operator:
    type: string
  state:
    enum:
      - CREATED
      - VALIDATED
      - PLANNED
      - PREPARED
      - RUNNING
      - VERIFYING
      - SUCCEEDED
      - FAILED
      - BLOCKED
      - NEEDS_REVIEW
      - ROLLED_BACK
      - CLEANED
  started_at_utc:
    type: string
    format: date-time
  finished_at_utc:
    type: [string, 'null']
    format: date-time
  scope:
    type: object
    additionalProperties: false
    required: [allowed_hosts, allowed_networks, external_targets]
    properties:
      allowed_hosts:
        type: array
        items:
          type: string
      allowed_networks:
        type: array
        items:
          type: string
      allowed_services:
        type: array
        items:
          type: string
      allowed_accounts:
        type: array
        items:
          type: string
      prohibited_actions:
        type: array
        items:
          type: string
      external_targets:
        const: prohibited
  versions:
    type: object
    additionalProperties:
      type: object
      required: [version]
      properties:
        version:
          type: string
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        source:
          type: string
  inputs:
    type: object
    additionalProperties: true
  steps:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, orchestrator, action, status]
      properties:
        id:
          type: string
        orchestrator:
          enum: [delivery, defense, attack, investigation, recovery, assurance]
        action:
          type: string
        status:
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED, BLOCKED, NEEDS_REVIEW, SKIPPED, ROLLED_BACK]
        started_at_utc:
          type: string
          format: date-time
        finished_at_utc:
          type: string
          format: date-time
        exit_code:
          type: integer
        result_ref:
          type: string
        evidence_refs:
          type: array
          items:
            type: string
        error:
          type: string
  evidence_manifest:
    type: string
  metrics:
    type: object
    additionalProperties: true
  handoff:
    type: object
    additionalProperties: false
    properties:
      producer:
        type: string
      consumer:
        type: string
      status:
        enum: [READY, REJECTED, NEEDS_REVIEW]
      manifest:
        type: string
  final_status:
    enum: [PASS, FAIL, BLOCKED, NEEDS_REVIEW]
  cleanup:
    type: object
    additionalProperties: false
    properties:
      required:
        type: boolean
      completed:
        type: boolean
      evidence_ref:
        type: string
  rollback:
    type: object
    additionalProperties: false
    properties:
      required:
        type: boolean
      completed:
        type: boolean
      evidence_ref:
        type: string
