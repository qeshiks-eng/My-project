$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.invalid/ecp/v12/scenario.schema.yaml
title: ECP Security Scenario
$type: object
additionalProperties: false
required:
  - api_version
  - kind
  - metadata
  - scope
  - workflow
  - acceptance
properties:
  api_version:
    const: ecp/v12
  kind:
    const: SecurityScenario
  metadata:
    type: object
    additionalProperties: false
    required: [project_id, scenario_id, phase]
    properties:
      project_id:
        type: string
        pattern: '^P(0[0-9]|1[0-9]|20)$'
      scenario_id:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{2,63}$'
      phase:
        enum: [baseline, run-a, remediation, run-b, recovery, assurance]
      description:
        type: string
      owner:
        type: string
  scope:
    type: object
    additionalProperties: false
    required: [inventory, external_targets]
    properties:
      inventory:
        type: string
      allowed_hosts:
        type: array
        uniqueItems: true
        items:
          type: string
      allowed_networks:
        type: array
        uniqueItems: true
        items:
          type: string
      allowed_services:
        type: array
        uniqueItems: true
        items:
          type: string
      allowed_accounts:
        type: array
        uniqueItems: true
        items:
          type: string
      allowed_techniques:
        type: array
        uniqueItems: true
        items:
          type: string
      prohibited_actions:
        type: array
        uniqueItems: true
        items:
          type: string
      external_targets:
        const: prohibited
      emergency_stop:
        type: object
        additionalProperties: false
        required: [method]
        properties:
          method:
            type: string
          owner:
            type: string
  variables:
    type: object
    additionalProperties: true
  workflow:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, orchestrator, action]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
        orchestrator:
          enum: [delivery, defense, attack, investigation, recovery, assurance]
        action:
          type: string
        inputs:
          type: object
          additionalProperties: true
        depends_on:
          type: array
          uniqueItems: true
          items:
            type: string
        on_failure:
          enum: [stop, rollback, continue, needs-review]
        approval_required:
          type: boolean
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 86400
  evidence:
    type: object
    additionalProperties: false
    properties:
      private_root:
        type: string
      public_root:
        type: string
      hash_algorithm:
        enum: [sha256, sha512]
      utc_required:
        type: boolean
      manifest_required:
        type: boolean
  acceptance:
    type: object
    additionalProperties: false
    required:
      - evidence_complete
      - functional_tests_passed
      - scope_respected
    properties:
      evidence_complete:
        type: boolean
      functional_tests_passed:
        type: boolean
      security_tests_passed:
        type: boolean
      regression_passed:
        type: boolean
      restore_verified:
        type: boolean
      scope_respected:
        const: true
      run_comparison_required:
        type: boolean
      human_review_required:
        type: boolean
  ai_advisory:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
      allowed_tasks:
        type: array
        uniqueItems: true
        items:
          enum: [summarization, classification, hypothesis-suggestion, report-draft]
      execution_authority:
        const: none
